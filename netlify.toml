[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# وكيل لواجهة ERIC (يحل مشكلة CORS)
[[redirects]]
  from = "/api/eric/*"
  to = "https://api.ies.ed.gov/eric/:splat"
  status = 200
  force = true

# دعم التوجيه (SPA)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
